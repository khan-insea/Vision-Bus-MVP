<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F4FAF7"/>
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#40C075" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F4FAF7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad)" />
  
  <g transform="translate(100, 50)">
    <!-- Eye Screening Diagram Graphic -->
    <rect x="50" y="50" width="500" height="350" rx="20" fill="#FFFFFF" stroke="#C3E8D5" stroke-width="4" />
    <!-- Screen Header -->
    <rect x="50" y="50" width="500" height="50" rx="20" fill="#E8F6F0" />
    <circle cx="90" cy="75" r="8" fill="#009B4E" />
    <circle cx="115" cy="75" r="8" fill="#40C075" />
    <circle cx="140" cy="75" r="8" fill="#00A896" />
    
    <!-- Big Eye symbol inside the diagram screen -->
    <g transform="translate(150, 120)">
      <!-- Sài Gòn Medical Cross Outline -->
      <rect x="100" y="0" width="100" height="240" fill="#009B4E" opacity="0.1" rx="10" />
      <rect x="30" y="70" width="240" height="100" fill="#009B4E" opacity="0.1" rx="10" />

      <!-- Eye Contour -->
      <path d="M 10 120 C 10 40, 140 30, 290 120 C 290 200, 140 210, 10 120 Z" stroke="#009B4E" stroke-width="12" stroke-linecap="round" fill="none" />
      <circle cx="150" cy="120" r="45" fill="#40C075" />
      <circle cx="150" cy="120" r="20" fill="#153324" />
      <circle cx="160" cy="110" r="8" fill="#FFFFFF" />
    </g>

    <!-- UI Graphs -->
    <path d="M 80 340 L 150 310 L 220 350 L 300 320 L 400 360 L 520 310" fill="none" stroke="#00A896" stroke-width="6" stroke-linecap="round" />
    <circle cx="520" cy="310" r="10" fill="#00A896" />
  </g>

  <!-- Big text title representing technology -->
  <text x="400" y="510" fill="#153324" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" text-anchor="middle">HỆ THỐNG ĐO KHÚC XẠ DI ĐỘNG</text>
  <text x="400" y="550" fill="#009B4E" font-family="system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle">Thiết Bị Nhãn Khoa Di Động Chuẩn 5 Sao</text>
</svg>
