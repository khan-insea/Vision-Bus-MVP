<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F4FAF7"/>
  <defs>
    <radialGradient id="patientGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#40C075" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F4FAF7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#patientGrad)" />
  
  <g transform="translate(250, 80)">
    <!-- Big Heart background -->
    <path d="M 150 130 C 150 60, 50 60, 50 130 C 50 200, 150 250, 150 270 C 150 250, 250 200, 250 130 C 250 60, 150 60, 150 130 Z" fill="#009B4E" opacity="0.1" />

    <!-- Happy Patient Face Graphic -->
    <!-- Head -->
    <circle cx="150" cy="140" r="70" fill="#FCD5C5" />
    <!-- Grey Hair -->
    <path d="M 80 140 C 70 70, 230 70, 220 140 C 220 120, 200 90, 150 90 C 100 90, 80 120, 80 140" fill="#EAECEE" />
    <path d="M 80 110 A 30 30 0 0 1 120 90 A 40 40 0 0 1 180 90 A 30 30 0 0 1 220 110" fill="#BDC3C7" />
    
    <!-- Eyes - Wide open, glowing bright green -->
    <ellipse cx="120" cy="140" rx="18" ry="10" fill="#FFFFFF" stroke="#009B4E" stroke-width="3" />
    <circle cx="120" cy="140" r="8" fill="#009B4E" />
    <circle cx="122" cy="138" r="3" fill="#FFFFFF" />

    <ellipse cx="180" cy="140" rx="18" ry="10" fill="#FFFFFF" stroke="#009B4E" stroke-width="3" />
    <circle cx="180" cy="140" r="8" fill="#009B4E" />
    <circle cx="182" cy="138" r="3" fill="#FFFFFF" />

    <!-- Rosy Cheeks -->
    <circle cx="100" cy="165" r="10" fill="#E74C3C" opacity="0.15" />
    <circle cx="200" cy="165" r="10" fill="#E74C3C" opacity="0.15" />

    <!-- Big Happy Smile -->
    <path d="M 115 170 Q 150 200 185 170" stroke="#153324" stroke-width="6" stroke-linecap="round" fill="none" />

    <!-- Clothes -->
    <path d="M 80 210 L 220 210 L 250 300 L 50 300 Z" fill="#00A896" />
    <!-- Red collar / flower pattern -->
    <path d="M 120 210 L 150 240 L 180 210" fill="#F4FAF7" />
  </g>

  <!-- Sparks & Hearts surrounding representing recovery -->
  <g fill="#009B4E">
    <path d="M 200 120 L 210 135 L 205 140 L 195 135 Z" />
    <path d="M 580 150 L 590 165 L 585 170 L 575 165 Z" />
    <circle cx="150" cy="220" r="8" fill="#40C075" />
    <circle cx="620" cy="280" r="12" fill="#40C075" />
  </g>

  <!-- Title Text -->
  <text x="400" y="490" fill="#153324" font-family="system-ui, sans-serif" font-weight="bold" font-size="28" text-anchor="middle">NỤ CƯỜI TÌM LẠI ÁNH SÁNG</text>
  <text x="400" y="530" fill="#009B4E" font-family="system-ui, sans-serif" font-weight="600" font-size="18" text-anchor="middle">Đồng Hành Mang Niềm Tin Đến Mọi Nhà</text>
</svg>
