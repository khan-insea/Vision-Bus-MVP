<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#F4FAF7"/>
  <defs>
    <linearGradient id="pressGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E8F6F0" />
    </linearGradient>
  </defs>
  <rect width="90%" height="85%" x="5%" y="7.5%" rx="16" fill="url(#pressGrad)" stroke="#C3E8D5" stroke-width="3" />
  
  <g transform="translate(60, 60)">
    <!-- Brand Logo representation -->
    <rect x="0" y="0" width="150" height="35" rx="6" fill="#009B4E" />
    <text x="75" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="2">TIN TỨC Y TẾ</text>

    <!-- Date -->
    <text x="400" y="22" fill="#00A896" font-family="system-ui, sans-serif" font-weight="bold" font-size="14" text-anchor="end">2026</text>

    <!-- Title Lines simulated -->
    <rect x="0" y="65" width="480" height="15" rx="3" fill="#153324" />
    <rect x="0" y="95" width="410" height="15" rx="3" fill="#153324" />

    <!-- Article layout columns -->
    <!-- Column 1: Image Mock -->
    <rect x="0" y="140" width="180" height="120" rx="10" fill="#E8F6F0" stroke="#40C075" stroke-width="2" />
    <!-- Mini green cross in image -->
    <rect x="80" y="180" width="20" height="40" fill="#009B4E" opacity="0.3" />
    <rect x="70" y="190" width="40" height="20" fill="#009B4E" opacity="0.3" />

    <!-- Column 2: Text Mock Lines -->
    <g transform="translate(200, 140)">
      <rect x="0" y="5" width="280" height="8" rx="2" fill="#88AD99" />
      <rect x="0" y="25" width="280" height="8" rx="2" fill="#88AD99" />
      <rect x="0" y="45" width="260" height="8" rx="2" fill="#88AD99" />
      <rect x="0" y="65" width="280" height="8" rx="2" fill="#88AD99" />
      <rect x="0" y="85" width="190" height="8" rx="2" fill="#88AD99" />
    </g>

    <!-- Rating / Heart -->
    <path d="M 450 250 C 450 240, 430 240, 430 250 C 430 260, 450 270, 450 275 C 450 270, 470 260, 470 250 C 470 240, 450 240, 450 250 Z" fill="#009B4E" />
  </g>
</svg>
