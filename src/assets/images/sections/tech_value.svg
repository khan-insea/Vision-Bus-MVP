<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#EBF9F1" rx="16" />
  <circle cx="200" cy="130" r="70" fill="#00B4D8" opacity="0.1" />
  
  <g transform="translate(130, 50)">
    <!-- Eye test / Lens machine graphic representation -->
    <rect x="15" y="20" width="110" height="110" rx="20" fill="#FFFFFF" stroke="#00B4D8" stroke-width="5" />
    <circle cx="70" cy="75" r="35" stroke="#00B4D8" stroke-width="4" fill="none" />
    <circle cx="70" cy="75" r="18" fill="#153324" />
    <circle cx="74" cy="71" r="5" fill="#FFFFFF" />
    
    <!-- Laser beam / high-tech lines -->
    <line x1="25" y1="75" x2="115" y2="75" stroke="#FF5733" stroke-width="2" stroke-dasharray="6 4" opacity="0.8" />
    
    <!-- Gear or processor node -->
    <circle cx="115" cy="120" r="15" fill="#E8F6F0" stroke="#00B4D8" stroke-width="2" />
    <path d="M 115 110 L 115 130 M 105 120 L 125 120" stroke="#00B4D8" stroke-width="2" />
  </g>
  
  <text x="200" y="245" fill="#153324" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">CÔNG NGHỆ CHẨN ĐOÁN</text>
  <text x="200" y="270" fill="#00B4D8" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Thiết Bị Cầm Tay Di Động Chuẩn Châu Âu</text>
</svg>
