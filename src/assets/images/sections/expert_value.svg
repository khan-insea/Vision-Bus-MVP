<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#EBF9F1" rx="16" />
  <circle cx="200" cy="130" r="70" fill="#009B4E" opacity="0.1" />
  
  <g transform="translate(130, 60)">
    <!-- Shield / Badge background -->
    <path d="M 70 10 L 130 30 L 130 90 C 130 130, 70 160, 70 160 C 70 160, 10 130, 10 90 L 10 30 Z" fill="#FFFFFF" stroke="#009B4E" stroke-width="5" />
    
    <!-- Medical Cross inside badge -->
    <rect x="58" y="55" width="24" height="60" fill="#009B4E" rx="3" />
    <rect x="40" y="73" width="60" height="24" fill="#009B4E" rx="3" />
    
    <!-- Doctor stethoscope graphic layered in -->
    <path d="M 30 115 C 30 145, 110 145, 110 115" stroke="#40C075" stroke-width="4" stroke-linecap="round" fill="none" />
    <circle cx="110" cy="115" r="6" fill="#40C075" />
  </g>
  
  <text x="200" y="245" fill="#153324" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" text-anchor="middle">CHUYÊN MÔN Y KHOA</text>
  <text x="200" y="270" fill="#009B4E" font-family="system-ui, sans-serif" font-weight="600" font-size="13" text-anchor="middle">Đội Ngũ Bác Sĩ Chuẩn Sài Gòn Mắt</text>
</svg>
