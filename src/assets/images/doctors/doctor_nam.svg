<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#E8F6F0"/>
  <circle cx="200" cy="150" r="80" fill="#009B4E" opacity="0.15" />
  <!-- Doctor avatar placeholder -->
  <g transform="translate(100, 70)">
    <!-- Hair background -->
    <path d="M 50 65 C 50 30, 150 30, 150 65 C 150 60, 140 45, 100 45 C 60 45, 50 60, 50 65" fill="#153324" />
    <path d="M 60 55 L 140 55 L 140 70 L 60 70 Z" fill="#153324" />
    <!-- Face -->
    <path d="M 65 70 Q 100 145 135 70 L 130 55 L 70 55 Z" fill="#FCD5C5" />
    <circle cx="85" cy="78" r="5" fill="#153324" />
    <circle cx="115" cy="78" r="5" fill="#153324" />
    <!-- Smile -->
    <path d="M 88 100 Q 100 112 112 100" stroke="#153324" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Glasses -->
    <rect x="73" y="70" width="22" height="15" rx="3" stroke="#009B4E" stroke-width="3" fill="none" />
    <rect x="105" y="70" width="22" height="15" rx="3" stroke="#009B4E" stroke-width="3" fill="none" />
    <line x1="95" y1="78" x2="105" y2="78" stroke="#009B4E" stroke-width="3" />
    <!-- Neck -->
    <rect x="90" y="115" width="20" height="25" fill="#FCD5C5" />
    <!-- Medical collar/coat -->
    <path d="M 50 140 L 150 140 L 160 250 L 40 250 Z" fill="#FFFFFF" />
    <path d="M 70 140 L 100 190 L 130 140" fill="#E8F6F0" />
    <path d="M 100 190 L 100 250" stroke="#C3E8D5" stroke-width="3" />
    <!-- Stethoscope -->
    <path d="M 80 140 C 80 185, 120 185, 120 140" stroke="#00A896" stroke-width="4" fill="none" />
    <!-- Cross icon badge -->
    <rect x="130" y="160" width="15" height="15" rx="3" fill="#009B4E" />
    <path d="M 137.5 163 L 137.5 172 M 133 167.5 L 142 167.5" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
  <!-- Text Label -->
  <text x="200" y="340" fill="#153324" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">ThS. BS. Lê Hoàng Nam</text>
  <text x="200" y="365" fill="#009B4E" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Bệnh Viện Mắt Sài Gòn Kiên Giang</text>
</svg>
