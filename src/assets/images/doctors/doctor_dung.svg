<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#E8F6F0"/>
  <circle cx="200" cy="150" r="80" fill="#009B4E" opacity="0.15" />
  <!-- Doctor avatar placeholder -->
  <g transform="translate(100, 70)">
    <!-- Hair background -->
    <path d="M 50 110 C 20 60, 40 10, 100 10 C 160 10, 180 60, 150 110" fill="#153324" />
    <!-- Face -->
    <path d="M 60 80 Q 100 150 140 80 L 135 60 L 65 60 Z" fill="#FCE0D6" />
    <circle cx="85" cy="70" r="5" fill="#153324" />
    <circle cx="115" cy="70" r="5" fill="#153324" />
    <!-- Smile -->
    <path d="M 90 95 Q 100 105 110 95" stroke="#153324" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Glasses -->
    <rect x="73" y="62" width="22" height="15" rx="3" stroke="#009B4E" stroke-width="3" fill="none" />
    <rect x="105" y="62" width="22" height="15" rx="3" stroke="#009B4E" stroke-width="3" fill="none" />
    <line x1="95" y1="70" x2="105" y2="70" stroke="#009B4E" stroke-width="3" />
    <!-- Neck -->
    <rect x="90" y="115" width="20" height="25" fill="#FCE0D6" />
    <!-- Medical collar/coat -->
    <path d="M 50 140 L 150 140 L 160 250 L 40 250 Z" fill="#FFFFFF" />
    <path d="M 70 140 L 100 190 L 130 140" fill="#E8F6F0" />
    <path d="M 100 190 L 100 250" stroke="#C3E8D5" stroke-width="3" />
    <!-- Stethoscope -->
    <path d="M 80 140 C 80 180, 120 180, 120 140" stroke="#00A896" stroke-width="4" fill="none" />
    <circle cx="120" cy="140" r="6" fill="#00A896" />
    <!-- Cross icon badge -->
    <rect x="130" y="160" width="15" height="15" rx="3" fill="#009B4E" />
    <path d="M 137.5 163 L 137.5 172 M 133 167.5 L 142 167.5" stroke="#FFFFFF" stroke-width="2.5" />
  </g>
  <!-- Text Label -->
  <text x="200" y="340" fill="#153324" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" text-anchor="middle">BS. CKII. Nguyễn Thị Mỹ Dung</text>
  <text x="200" y="365" fill="#009B4E" font-family="system-ui, sans-serif" font-weight="600" font-size="14" text-anchor="middle">Bệnh Viện Mắt Sài Gòn Kiên Giang</text>
</svg>
