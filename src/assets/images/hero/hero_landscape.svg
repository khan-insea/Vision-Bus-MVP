<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2EDEC" />
      <stop offset="50%" stop-color="#D4E6E3" />
      <stop offset="100%" stop-color="#C5DDD9" />
    </linearGradient>

    <!-- Room Wall Gradient -->
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DFEBE8" />
      <stop offset="100%" stop-color="#CFE0DC" />
    </linearGradient>

    <!-- Wood Table Gradient -->
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C5A3C" />
      <stop offset="100%" stop-color="#733B22" />
    </linearGradient>

    <!-- Sign Gradient & Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#009B4E" flood-opacity="0.2" />
    </filter>

    <!-- Shirt Gradients -->
    <linearGradient id="manShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="womanShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2C7B8" />
      <stop offset="100%" stop-color="#7DAE9B" />
    </linearGradient>

    <!-- Skin Tones -->
    <linearGradient id="skinMan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBB995" />
      <stop offset="100%" stop-color="#D99E75" />
    </linearGradient>
    <linearGradient id="skinWoman" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2C4A2" />
      <stop offset="100%" stop-color="#DEAA83" />
    </linearGradient>

    <!-- Glasses Glass Effect -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Background Room / Wall -->
  <rect x="0" y="0" width="800" height="320" fill="url(#wallGrad)" />
  
  <!-- Windows in Background -->
  <g opacity="0.35" fill="#FFFFFF" stroke="#B0C8C3" stroke-width="3">
    <rect x="180" y="40" width="100" height="140" rx="4" />
    <line x1="230" y1="40" x2="230" y2="180" />
    <line x1="180" y1="100" x2="280" y2="100" />

    <rect x="310" y="40" width="100" height="140" rx="4" />
    <line x1="360" y1="40" x2="360" y2="180" />
    <line x1="310" y1="100" x2="410" y2="100" />

    <rect x="440" y="40" width="100" height="140" rx="4" />
    <line x1="490" y1="40" x2="490" y2="180" />
    <line x1="440" y1="100" x2="540" y2="100" />
  </g>

  <!-- Background People (Blurred/Simplified Audience) -->
  <g opacity="0.5">
    <!-- Man left background blue shirt -->
    <path d="M 100 240 Q 140 210 180 240 L 180 320 L 100 320 Z" fill="#2563EB" />
    <circle cx="140" cy="180" r="22" fill="#D99E75" />
    
    <!-- Person middle background blue shirt -->
    <path d="M 280 230 Q 320 200 360 230 L 360 320 L 280 320 Z" fill="#1D4ED8" />
    <circle cx="320" cy="175" r="20" fill="#C88E67" />

    <!-- Person right background white shirt -->
    <path d="M 620 220 Q 660 190 700 220 L 700 320 L 620 320 Z" fill="#E2E8F0" />
    <circle cx="660" cy="170" r="22" fill="#D99E75" />

    <!-- Person far right -->
    <path d="M 710 240 Q 750 210 790 240 L 790 320 L 710 320 Z" fill="#B91C1C" />
    <circle cx="750" cy="185" r="20" fill="#C88E67" />
  </g>

  <!-- Wooden Table in Background -->
  <rect x="0" y="270" width="800" height="70" fill="url(#tableGrad)" />

  <!-- Wooden Chairs Background -->
  <rect x="230" y="220" width="70" height="90" rx="8" fill="#542813" opacity="0.8" />
  <rect x="520" y="210" width="75" height="100" rx="8" fill="#542813" opacity="0.8" />

  <!-- FOREGROUND FIGURES -->

  <!-- Left Person (Blue Shirt guy sitting near edge) -->
  <g id="leftOuterPerson">
    <path d="M 0 320 Q 80 280 180 350 L 180 533 L 0 533 Z" fill="#2563EB" />
    <path d="M 120 400 L 180 370 L 180 533 L 100 533 Z" fill="#1D4ED8" />
  </g>

  <!-- ELDERLY MAN (CENTER LEFT - WITH PROTECTIVE GLASSES) -->
  <g id="elderlyMan">
    <!-- Body / Shirt -->
    <path d="M 230 330 Q 330 290 430 330 L 450 533 L 200 533 Z" fill="url(#manShirt)" filter="url(#shadow)" />
    
    <!-- Vertical subtle stripes on shirt -->
    <path d="M 270 340 L 260 533 M 300 335 L 295 533 M 330 330 L 330 533 M 360 335 L 365 533 M 390 340 L 400 533" stroke="#CBD5E1" stroke-width="2" />

    <!-- Collar -->
    <path d="M 310 325 L 330 370 L 305 375 Z" fill="#FFFFFF" stroke="#CBD5E1" />
    <path d="M 350 325 L 330 370 L 355 375 Z" fill="#FFFFFF" stroke="#CBD5E1" />

    <!-- Neck -->
    <rect x="318" y="280" width="24" height="50" fill="url(#skinMan)" rx="4" />

    <!-- Head -->
    <path d="M 290 220 C 290 170 370 170 370 220 C 370 270 360 290 330 290 C 300 290 290 270 290 220 Z" fill="url(#skinMan)" />

    <!-- Ears -->
    <ellipse cx="288" cy="225" rx="8" ry="14" fill="#D99E75" />
    <ellipse cx="372" cy="225" rx="8" ry="14" fill="#D99E75" />

    <!-- Hair (Gray/Dark Mix) -->
    <path d="M 288 215 C 285 175 310 160 330 160 C 355 160 372 175 372 215 C 360 175 340 170 330 170 C 315 170 295 180 288 215 Z" fill="#475569" />
    <path d="M 292 200 Q 330 165 368 200 Q 335 172 292 200 Z" fill="#94A3B8" opacity="0.8" />

    <!-- Face Details (Eyes, Nose, Wrinkles) -->
    <!-- Eyebrows -->
    <path d="M 302 205 Q 315 200 324 205" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <path d="M 336 205 Q 345 200 358 205" stroke="#475569" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Eyes (Squinting/Warm) -->
    <ellipse cx="313" cy="214" rx="5" ry="3" fill="#1E293B" />
    <ellipse cx="347" cy="214" rx="5" ry="3" fill="#1E293B" />

    <!-- Nose -->
    <path d="M 330 210 L 328 232 L 334 232" stroke="#B47348" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Mouth (Gentle Smile) -->
    <path d="M 315 252 Q 330 260 345 252" stroke="#A15B2C" stroke-width="2.5" fill="none" stroke-linecap="round" />

    <!-- Clear Protective Glasses (Safety Goggles) -->
    <rect x="295" y="200" width="70" height="26" rx="6" fill="url(#glassReflect)" stroke="#94A3B8" stroke-width="2.5" />
    <!-- Glasses Side Arms -->
    <path d="M 295 210 L 286 215 M 365 210 L 374 215" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <!-- Glasses shine reflection -->
    <path d="M 300 204 L 320 204 L 308 222 Z" fill="#FFFFFF" opacity="0.5" />
    <path d="M 338 204 L 358 204 L 346 222 Z" fill="#FFFFFF" opacity="0.5" />

    <!-- Hand & Arm holding Sign Stick -->
    <path d="M 370 380 Q 390 410 395 440" stroke="url(#skinMan)" stroke-width="24" stroke-linecap="round" fill="none" />
    <circle cx="392" cy="420" r="16" fill="url(#skinMan)" />
  </g>

  <!-- ELDERLY WOMAN (CENTER RIGHT - SAGE GREEN SHIRT, SMILING) -->
  <g id="elderlyWoman">
    <!-- Body / Sage Green Blouse -->
    <path d="M 440 330 Q 530 290 620 340 L 650 533 L 410 533 Z" fill="url(#womanShirt)" filter="url(#shadow)" />

    <!-- Collar -->
    <path d="M 505 330 L 525 370 L 490 360 Z" fill="#5C8A78" />
    <path d="M 545 330 L 525 370 L 560 360 Z" fill="#5C8A78" />

    <!-- Neck -->
    <rect x="515" y="280" width="22" height="50" fill="url(#skinWoman)" rx="4" />

    <!-- Head -->
    <path d="M 490 215 C 490 165 560 165 560 215 C 560 265 550 285 525 285 C 500 285 490 265 490 215 Z" fill="url(#skinWoman)" />

    <!-- Ears -->
    <ellipse cx="488" cy="220" rx="7" ry="12" fill="#DEAA83" />
    <ellipse cx="562" cy="220" rx="7" ry="12" fill="#DEAA83" />

    <!-- Silver/Gray Short Hair -->
    <path d="M 485 210 C 480 160 510 145 525 145 C 545 145 565 160 565 210 C 555 160 535 155 525 155 C 510 155 492 165 485 210 Z" fill="#CBD5E1" />
    <path d="M 488 190 Q 525 150 562 190 Q 525 160 488 190 Z" fill="#E2E8F0" />

    <!-- Face Details (Warm Big Smile & Wrinkles) -->
    <!-- Eyebrows -->
    <path d="M 500 200 Q 510 195 518 200" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />
    <path d="M 532 200 Q 540 195 550 200" stroke="#64748B" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Happy Curved Eyes -->
    <path d="M 502 208 Q 510 214 518 208" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round" />
    <path d="M 532 208 Q 540 214 548 208" stroke="#1E293B" stroke-width="3" fill="none" stroke-linecap="round" />

    <!-- Nose -->
    <path d="M 525 205 L 523 226 L 528 226" stroke="#C4885F" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Broad Happy Smile with Teeth -->
    <path d="M 506 242 Q 525 262 544 242 Z" fill="#FFFFFF" stroke="#9A5034" stroke-width="2" />
    <path d="M 506 242 Q 525 248 544 242" stroke="#9A5034" stroke-width="1.5" />

    <!-- Rosy Cheeks -->
    <ellipse cx="498" cy="225" rx="8" ry="5" fill="#F43F5E" opacity="0.25" />
    <ellipse cx="552" cy="225" rx="8" ry="5" fill="#F43F5E" opacity="0.25" />

    <!-- Hands Holding Sign -->
    <ellipse cx="530" cy="380" rx="14" ry="18" fill="url(#skinWoman)" />
    <ellipse cx="550" cy="385" rx="14" ry="18" fill="url(#skinWoman)" />
  </g>

  <!-- Right Person Background (Sitting next to woman) -->
  <g opacity="0.7">
    <path d="M 580 320 Q 660 270 760 330 L 800 533 L 580 533 Z" fill="#E2E8F0" />
    <circle cx="670" cy="220" r="28" fill="#D99E75" />
  </g>


  <!-- SIGN 1: HELD BY ELDERLY MAN ("BỆNH VIỆN MẮT SÀI GÒN") -->
  <g id="signMan" filter="url(#shadow)">
    <!-- Wooden Handle Stick -->
    <rect x="388" y="360" width="8" height="85" fill="#D4A373" rx="2" />

    <!-- White Sign Board -->
    <rect x="310" y="285" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

    <!-- Logo: Green Cross with Eye Symbol -->
    <g transform="translate(320, 298)">
      <!-- Green Cross -->
      <path d="M 16 0 L 26 0 L 26 12 L 38 12 L 38 22 L 26 22 L 26 34 L 16 34 L 16 22 L 4 22 L 4 12 L 16 12 Z" fill="#009B4E" />
      <!-- Eye Inside Cross -->
      <path d="M 10 17 Q 21 8 32 17 Q 21 26 10 17 Z" fill="#FFFFFF" stroke="#009B4E" stroke-width="1.5" />
      <circle cx="21" cy="17" r="4" fill="#009B4E" />
    </g>

    <!-- Text on Sign 1 -->
    <text x="365" y="318" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="11" fill="#153324" letter-spacing="0.5">BỆNH VIỆN MẮT</text>
    <text x="365" y="342" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18" fill="#009B4E" letter-spacing="0.8">SÀI GÒN</text>
  </g>


  <!-- SIGN 2: HELD BY ELDERLY WOMAN ("I ♥ MẮT SÀI GÒN KIÊN GIANG") -->
  <g id="signWoman" filter="url(#shadow)">
    <!-- Wooden Handle Stick -->
    <rect x="542" y="330" width="8" height="70" fill="#D4A373" rx="2" />

    <!-- White Sign Board -->
    <rect x="480" y="265" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

    <!-- Text "I" -->
    <text x="525" y="302" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="20" fill="#153324">I</text>

    <!-- Red Heart "♥" -->
    <path d="M 552 292 C 552 284 540 284 540 293 C 540 302 552 309 552 312 C 552 309 564 302 564 293 C 564 284 552 284 552 292 Z" fill="#EF4444" />

    <!-- Green sparkles near heart -->
    <path d="M 586 273 L 588 278 L 593 280 L 588 282 L 586 287 L 584 282 L 579 280 L 584 278 Z" fill="#009B4E" />

    <!-- Text "MẮT SÀI GÒN KIÊN GIANG" -->
    <text x="492" y="322" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="10.5" fill="#009B4E" letter-spacing="0.2">MẮT SÀI GÒN KIÊN GIANG</text>
  </g>


  <!-- BOTTOM BADGE OVERLAY: "Bệnh viện Mắt Sài Gòn Kiên Giang" -->
  <g transform="translate(160, 475)" filter="url(#shadow)">
    <!-- Cyan/Green heart pulse icon -->
    <g transform="translate(0, -2)">
      <circle cx="16" cy="16" r="14" fill="#009B4E" />
      <path d="M 10 16 L 13 16 L 15 11 L 18 21 L 20 14 L 22 16 L 24 16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Text with white stroke outline for high readability -->
    <text x="38" y="21" font-family="Plus Jakarta Sans, Arial, sans-serif" font-weight="900" font-size="17" fill="#FFFFFF" stroke="#000000" stroke-width="3" stroke-linejoin="round" paint-order="stroke fill">
      Bệnh viện Mắt Sài Gòn Kiên Giang
    </text>
  </g>
</svg>
